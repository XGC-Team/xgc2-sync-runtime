[workspace]
resolver = "3"
members = ["crates/xgc2-module-host"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/XGC-Team/xgc2-module"

[workspace.dependencies]
# Control plane: XRPC http.v1 over a Unix socket. The host uses Runtime, Host::bind,
# handler/Fault, Limits::default and (in tests) BlockingClient only.
xgc2-xrpc = { git = "https://github.com/XGC-Team/xgc2-xrpc", rev = "3e7f4653f42218e7bffaad5752afc5f89690afd2" }
libc = "0.2"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
tempfile = "3"

[profile.release]
debug = 1

# Module loading hashes every library; unoptimized sha2 takes about a second per
# debug-built module and slows the integration tests.
[profile.dev.package.sha2]
opt-level = 3
