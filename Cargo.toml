[workspace]
resolver = "3"
members = [
  "crates/xgc-rt-abi",
  "crates/xgc-rt-core",
  "crates/xgc-rt-audit",
  "crates/xgc-rt-clock",
  "crates/xgc-rt-transport-loopback",
  "crates/xgc-rt-transport-zenoh",
  "crates/xgc-rt-impair",
  "crates/xgc-rt-host",
  "plugins/stub-perception",
  "plugins/stub-estimation",
  "plugins/stub-planning",
  "plugins/stub-control",
  "plugins/dmpc-exchange-demo",
  "plugins/station-io",
  "plugins/transport-loopback",
  "plugins/transport-zenoh",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/XGC-Team/xgc2-sync-runtime"

[workspace.dependencies]
xgc2-xrpc = { git = "https://github.com/XGC-Team/xgc2-xrpc", rev = "35c2262358a39843c347249efd80c1788cb79849" }
xgc-rt-abi = { path = "crates/xgc-rt-abi" }
xgc-rt-core = { path = "crates/xgc-rt-core" }
xgc-rt-audit = { path = "crates/xgc-rt-audit" }
xgc-rt-clock = { path = "crates/xgc-rt-clock" }
xgc-rt-transport-loopback = { path = "crates/xgc-rt-transport-loopback" }
xgc-rt-transport-zenoh = { path = "crates/xgc-rt-transport-zenoh" }
xgc-rt-impair = { path = "crates/xgc-rt-impair" }
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"

[profile.release]
debug = 1

# Plugin loading hashes each library; unoptimized sha2 takes about a second
# per debug-built plugin and made multi-host tests miss their epoch.
[profile.dev.package.sha2]
opt-level = 3
