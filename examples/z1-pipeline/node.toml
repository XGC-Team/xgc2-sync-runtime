# Z1 demo: one node, five plugins (four Rust, one C), loopback transport.
# Run with examples/z1-pipeline/run.sh.

[session]
id = "z1-pipeline"
node = "uav1"
roster = ["uav1"]
period_ms = 20
start_delay_ms = 200
run_for_ms = 5000

[transport]
kind = "loopback"

[audit]
dir = "../../out/z1-pipeline"

[[channel]]
name = "detections"
qos = "state"
[[channel]]
name = "state"
qos = "state"
[[channel]]
name = "plan"
qos = "control"
[[channel]]
name = "cmd"
qos = "event"

[[plugin]]
name = "perception"
path = "../../target/release/libstub_perception.so"
trigger = "on_round"
config = { payload_bytes = 1024 }
bind = { detections = { channel = "detections" } }

[[plugin]]
name = "estimation"
path = "../../target/release/libstub_estimation.so"
trigger = "on_dirty"
bind = { detections = { channel = "detections", from = ["uav1"] }, state = { channel = "state" } }

[[plugin]]
name = "planning"
path = "../../target/release/libstub_planning.so"
trigger = "both"
bind = { state = { channel = "state", from = ["uav1"] }, plan = { channel = "plan" } }

[[plugin]]
name = "control"
path = "../../target/release/libstub_control.so"
trigger = "on_dirty"
bind = { plan = { channel = "plan", from = ["uav1"] }, cmd = { channel = "cmd" } }

[[plugin]]
name = "sink"
path = "../../target/release/libc_stub.so"
trigger = "on_dirty"
restart = { policy = "on_error", max = 3, backoff_ms = 100 }
bind = { cmd = { channel = "cmd", from = ["uav1"] } }
