schema: xgc2.product.v1
id: libxgc2-runtime-sdk-dev
name: XGC Runtime SDK
version: 0.1.0-3
kind: toolchain-apt
summary: Header-only C/C++ plugin, clock-source and flat-config SDK for XGC Runtime consumers.
apt:
  distribution: focal
  install:
  - libxgc2-runtime-sdk-dev
  packages:
  - libxgc2-runtime-sdk-dev
  package_architectures:
    libxgc2-runtime-sdk-dev:
    - amd64
    - arm64
  depends: []
usage:
  install: dpkg -i libxgc2-runtime-sdk-dev_0.1.0-3~focal_all.deb
  smoke_test: python3 abi/tests/test_sdk.py --work-dir /tmp/xgc-runtime-sdk-check
  notes: >-
    Consumers use find_package(XgcRuntimeSDK CONFIG REQUIRED) and link
    XgcRuntime::SDK. The installed include directory is include/xgc-runtime;
    xgc_rt.h, xgc_clock_source.h and flat_config.hpp keep their flat include
    names. Business records and domain contracts come from their owning products. An explicit source build can
    add_subdirectory(${XGC_RUNTIME_SDK_SOURCE_ROOT}/abi ...) and link the same
    target. This development package has no runtime binary or hard package
    dependency. Local package validation is not APT publication or downstream
    installation evidence.
ownership:
  paths:
  - /usr/include/xgc-runtime
  - /usr/share/cmake/XgcRuntimeSDK
release:
  repository: XGC-Team/xgc2-sync-runtime
  ref: main
  ci_workflow: ci.yml
  workflow: release.yml
  apt_versions:
    focal: 0.1.0-3~focal
