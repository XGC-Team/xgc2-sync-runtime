# uav-dmpc-planner/v1
# GCS planner only. No controller, no actuator, no hover-thrust.
# paired_state and controller status come from the control node.
[session]
id = "UNBOUND"
node = "SELF"
roster = ["SELF"]
period_ms = 1
epoch_ns = 1
[transport]
kind = "zenoh"
listen = []
connect = []
[audit]
dir = "UNBOUND"

[[channel]]
name = "command"
qos = "event"
[[channel]]
name = "mission_request"
qos = "event"
[[channel]]
name = "paired_state"
qos = "state"
[[channel]]
name = "controller_state"
qos = "state"
[[channel]]
name = "position_target"
qos = "control"
[[channel]]
name = "scene_snapshot"
qos = "state"
[[channel]]
name = "scene_heartbeat"
qos = "state"
[[channel]]
name = "own_plan"
qos = "control"
[[channel]]
name = "radio_plan"
qos = "control"
[[channel]]
name = "neighbor_plan"
qos = "control"
[[channel]]
name = "sync_trigger"
qos = "control"
[[channel]]
name = "timeline_commit"
qos = "event"
[[channel]]
name = "timeline_ack"
qos = "event"
[[channel]]
name = "rounds_timeline_status"
qos = "state"
[[channel]]
name = "planner_timeline_status"
qos = "state"
[[channel]]
name = "planner_status"
qos = "state"

[[plugin]]
name = "ros_io"
path = "ros_io"
trigger = "on_round"
config = {}
bind = {scene_snapshot={channel="scene_snapshot"},scene_heartbeat={channel="scene_heartbeat"},timeline_ack={channel="timeline_ack",from=["SELF"]},timeline_status={channel="rounds_timeline_status",from=["SELF"]}}

[[plugin]]
name = "dmpc-rounds"
path = "dmpc_rounds"
trigger = "on_round"
config = {}
bind = {own_plan={channel="own_plan",from=["SELF"]},plan_in={channel="radio_plan",from=["PEERS"]},plan_out={channel="radio_plan"},neighbor_plans={channel="neighbor_plan"},sync_trigger={channel="sync_trigger"},own_state={channel="controller_state",from=["CONTROL"]},mission_request={channel="mission_request",from=["AUTHORITY"]},timeline_ack={channel="timeline_ack"},timeline_status={channel="rounds_timeline_status"},timeline_commit={channel="timeline_commit"}}

[[plugin]]
name = "plan-dmpc"
path = "plan_dmpc"
trigger = "on_round"
config = {}
step_budget_ms = 80
bind = {paired_state={channel="paired_state",from=["CONTROL"]},controller_state={channel="controller_state",from=["CONTROL"]},scene_snapshot={channel="scene_snapshot",from=["SELF"]},scene_heartbeat={channel="scene_heartbeat",from=["SELF"]},timeline_commit={channel="timeline_commit",from=["SELF"]},neighbor_plan={channel="neighbor_plan",from=["SELF"]},sync_trigger={channel="sync_trigger",from=["SELF"]},timeline_status={channel="planner_timeline_status"},position_target={channel="position_target"},own_plan={channel="own_plan"},planner_status={channel="planner_status"}}

[[plugin]]
name = "station-io"
path = "station_io"
trigger = "on_round"
config = {}
bind = {paired_state={channel="paired_state",from=["CONTROL"]},command={channel="command"},mission_request={channel="mission_request"}}
