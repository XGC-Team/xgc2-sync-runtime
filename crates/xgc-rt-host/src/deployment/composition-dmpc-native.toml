# uav-dmpc-native/v1
# Colocated planner and SMC. No hover-thrust plugin and no attitude-rate channel.
# SMC reads MAVROS local_pose and local_velocity from ros_io. It does not bind
# rigid_state or estimate. Actuator outputs are setpoint and fcu_request.
# paired_state is ros_io's existing output from MAVROS local_pose and local_velocity.
[session]
id = "UNBOUND"
node = "SELF"
roster = ["SELF"]
period_ms = 1
epoch_ns = 1
[transport]
kind = "zenoh"
listen = []
connect = []
[audit]
dir = "UNBOUND"

[[channel]]
name = "imu"
qos = "state"
[[channel]]
name = "pose"
qos = "state"
[[channel]]
name = "fcu_state"
qos = "state"
[[channel]]
name = "local_pose"
qos = "state"
[[channel]]
name = "local_velocity"
qos = "state"
[[channel]]
name = "fcu_imu"
qos = "state"
[[channel]]
name = "battery"
qos = "state"
[[channel]]
name = "command"
qos = "event"
[[channel]]
name = "mission_request"
qos = "event"
[[channel]]
name = "setpoint"
qos = "control"
[[channel]]
name = "fcu_request"
qos = "event"
[[channel]]
name = "controller_state"
qos = "state"
[[channel]]
name = "paired_state"
qos = "state"
[[channel]]
name = "position_target"
qos = "control"
[[channel]]
name = "scene_snapshot"
qos = "state"
[[channel]]
name = "scene_heartbeat"
qos = "state"
[[channel]]
name = "own_plan"
qos = "control"
[[channel]]
name = "radio_plan"
qos = "control"
[[channel]]
name = "neighbor_plan"
qos = "control"
[[channel]]
name = "sync_trigger"
qos = "control"
[[channel]]
name = "timeline_commit"
qos = "event"
[[channel]]
name = "timeline_ack"
qos = "event"
[[channel]]
name = "rounds_timeline_status"
qos = "state"
[[channel]]
name = "planner_timeline_status"
qos = "state"
[[channel]]
name = "planner_status"
qos = "state"

[[plugin]]
name = "ros_io"
path = "ros_io"
trigger = "on_round"
config = {}
bind = {imu={channel="imu"},pose={channel="pose"},vision_pose={channel="pose",from=["SELF"]},fcu_state={channel="fcu_state"},local_pose={channel="local_pose"},local_velocity={channel="local_velocity"},fcu_imu={channel="fcu_imu"},battery={channel="battery"},paired_state={channel="paired_state"},setpoint={channel="setpoint",from=["SELF"]},fcu_request={channel="fcu_request",from=["SELF"]},status={channel="controller_state",from=["SELF"]},scene_snapshot={channel="scene_snapshot"},scene_heartbeat={channel="scene_heartbeat"},timeline_ack={channel="timeline_ack",from=["SELF"]},timeline_status={channel="rounds_timeline_status",from=["SELF"]}}

[[plugin]]
name = "ctl-px4"
path = "controller"
trigger = "on_round"
step_budget_ms = 10
config = {time_source="session",tracking_backend="smc",planning_period=0.1}
bind = {local_pose={channel="local_pose",from=["SELF"]},local_velocity={channel="local_velocity",from=["SELF"]},imu={channel="fcu_imu",from=["SELF"]},fcu_state={channel="fcu_state",from=["SELF"]},battery={channel="battery",from=["SELF"]},vrpn_pose={channel="pose",from=["SELF"]},command={channel="command",from=["AUTHORITY"]},alg_setpoint={channel="position_target",from=["PLANNER"]},setpoint={channel="setpoint"},fcu_request={channel="fcu_request"},status={channel="controller_state"}}

[[plugin]]
name = "dmpc-rounds"
path = "dmpc_rounds"
trigger = "on_round"
config = {}
bind = {own_plan={channel="own_plan",from=["SELF"]},plan_in={channel="radio_plan",from=["PEERS"]},plan_out={channel="radio_plan"},neighbor_plans={channel="neighbor_plan"},sync_trigger={channel="sync_trigger"},own_state={channel="controller_state",from=["CONTROL"]},mission_request={channel="mission_request",from=["AUTHORITY"]},timeline_ack={channel="timeline_ack"},timeline_status={channel="rounds_timeline_status"},timeline_commit={channel="timeline_commit"}}

[[plugin]]
name = "plan-dmpc"
path = "plan_dmpc"
trigger = "on_round"
config = {}
step_budget_ms = 80
bind = {paired_state={channel="paired_state",from=["SELF"]},controller_state={channel="controller_state",from=["CONTROL"]},scene_snapshot={channel="scene_snapshot",from=["SELF"]},scene_heartbeat={channel="scene_heartbeat",from=["SELF"]},timeline_commit={channel="timeline_commit",from=["SELF"]},neighbor_plan={channel="neighbor_plan",from=["SELF"]},sync_trigger={channel="sync_trigger",from=["SELF"]},timeline_status={channel="planner_timeline_status"},position_target={channel="position_target"},own_plan={channel="own_plan"},planner_status={channel="planner_status"}}

[[plugin]]
name = "station-io"
path = "station_io"
trigger = "on_round"
config = {}
bind = {paired_state={channel="paired_state",from=["SELF"]},imu={channel="fcu_imu",from=["SELF"]},battery={channel="battery",from=["SELF"]},fcu_state={channel="fcu_state",from=["SELF"]},controller_status={channel="controller_state",from=["SELF"]},command={channel="command"},mission_request={channel="mission_request"}}
