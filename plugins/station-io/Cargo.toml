[package]
name = "station-io"
description = "GCS instrument uplink and authority-only station command edge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "station_io"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "station-io-cmd"
path = "src/main.rs"

[dependencies]
libc = "0.2"
xgc-rt-abi.workspace = true
serde_json.workspace = true
toml.workspace = true
zenoh = { version = "=1.9.0", default-features = false, features = ["transport_tcp", "unstable"] }

[dev-dependencies]
xgc-rt-host = { path = "../../crates/xgc-rt-host" }
xgc-rt-core.workspace = true
xgc-rt-transport-loopback.workspace = true
serde_json.workspace = true
zenoh = { version = "=1.9.0", default-features = false, features = ["transport_tcp", "unstable"] }
